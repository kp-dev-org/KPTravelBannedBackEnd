
server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
spring.application.name=TravelBanned-API

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

frontend.urlOne=${FRONTEND_LOCAL_URL_ONE:http://localhost:3000}
frontend.urlTwo=${FRONTEND_LOCAL_URL_TWO:http://localhost:5173}
frontend.urlTree=${FRONTEND_URL:https://tavelbanned.vercel.app}

flyasky.auth.base-url=https://backend.flyasky.com/auth/v1/api/auth
flyasky.auth.jwks-url=https://backend.flyasky.com/auth/v1/api/auth/jwks
flyasky.auth.issuer=https://backend.flyasky.com
flyasky.auth.audience=api-gateway

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.cookie.name=_sec_session

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=avatars

logging.level.root=ERROR
logging.level.com.PassBanned.API=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never